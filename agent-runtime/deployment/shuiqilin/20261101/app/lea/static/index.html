<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>水麒麟 · 记忆与工具 · 工作台</title>
<style>
:root{color-scheme:dark;--bg:#0c1116;--panel:#131c24;--line:#273743;--fg:#e4eef3;--muted:#8ca2b1;--accent:#66dfbc;--bad:#ff9c99}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.65 system-ui,"Microsoft YaHei",sans-serif}button,input,textarea{font:inherit}button{cursor:pointer;border:1px solid var(--line);border-radius:8px;padding:8px 13px;background:#1c2b36;color:var(--fg)}button:hover{border-color:var(--accent)}button.primary{background:var(--accent);border-color:var(--accent);color:#0a2820;font-weight:650}button:disabled{opacity:.45;cursor:default}input,textarea{width:100%;background:#0c151d;color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:11px}textarea{resize:vertical}header{height:76px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px}header strong{font-size:19px;letter-spacing:.02em}header small{display:block;color:var(--muted);font-size:11px}.tag{display:inline-block;padding:3px 9px;background:#1a302b;color:var(--accent);border-radius:20px;font-size:12px}main{display:grid;grid-template-columns:240px minmax(420px,1fr) 330px;height:calc(100dvh - 76px)}aside{padding:20px 16px;overflow:auto}aside.left{border-right:1px solid var(--line)}aside.right{border-left:1px solid var(--line)}#tasklist button{display:block;text-align:left;width:100%;margin-top:9px;overflow:hidden;text-overflow:ellipsis}#tasklist button.selected{border-color:var(--accent);background:#1b342d}.muted{color:var(--muted);font-size:12px}.section{margin:0 0 24px}.section h3{font-size:13px;margin:0 0 10px;color:var(--muted)}.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;margin:10px 0;overflow-wrap:anywhere}.chat{display:flex;flex-direction:column;min-height:0}.titlebar{padding:20px 24px 14px;border-bottom:1px solid var(--line)}h1{font-size:18px;margin:0 0 10px;overflow-wrap:anywhere}.toolbar{display:flex;gap:7px;flex-wrap:wrap}.toolbar button{padding:5px 9px;font-size:12px}#messages{flex:1;overflow:auto;padding:22px 26px}.bubble{max-width:90%;padding:15px 18px;margin:0 0 18px;border:1px solid var(--line);border-radius:12px;background:var(--panel);white-space:pre-wrap;overflow-wrap:anywhere}.bubble.user{margin-left:auto;background:#19362e;border-color:#285044}.bubble label{display:block;color:var(--accent);font-size:11px;margin-bottom:6px}.composer{padding:14px 24px 20px;border-top:1px solid var(--line)}.composer>div{display:flex;align-items:flex-end;gap:10px}.composer textarea{min-height:72px;max-height:220px}.composer button{height:45px;min-width:78px}.status{min-height:24px;font-size:12px;color:var(--muted)}.error{color:var(--bad)}.log{font-size:11px;border-left:2px solid var(--line);padding:4px 10px;margin-bottom:7px}.log b{color:var(--accent)}details{margin:8px 0}summary{cursor:pointer;color:var(--muted)}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.6 ui-monospace,monospace}.ref{color:var(--accent);background:transparent;padding:3px 5px;font:11px ui-monospace,monospace}.empty{color:var(--muted);padding:40px 20px;text-align:center}dialog{background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:14px;width:min(680px,92vw);max-height:85vh;overflow:auto;padding:25px}dialog::backdrop{background:#000a}dialog h2{font-size:18px;margin-top:0}dialog label{display:block;margin:14px 0 6px}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}dialog input[type=checkbox]{width:auto}.big{font-size:24px;font-weight:650}.scene{display:flex;gap:8px}.room{flex:1;border:1px solid var(--line);border-radius:8px;padding:12px;text-align:center}.room.active{border-color:var(--accent);background:#17352d}@media(max-width:1100px){main{grid-template-columns:210px 1fr}.right{display:none}}@media(max-width:700px){main{grid-template-columns:1fr}.left{display:none}header{padding:0 16px}header strong{font-size:16px}.bubble{max-width:100%}}
@media(max-width:700px){#config{display:none}header{gap:8px}header>div:last-child{display:flex;gap:7px;align-items:center}header small{font-size:10px}}
</style></head><body>
<header><div><strong>水麒麟 · 记忆与工具</strong><small id="memoryHealth">短上下文执行 · 事务交接 · 语义记忆检索</small></div><div><span class="tag" id="health">正在连接…</span> <span class="muted" id="config"></span> <button id="newtaskTop">＋ 新任务</button></div></header>
<main><aside class="left"><button class="primary" id="newtask" style="width:100%">＋ 新建任务</button><div class="muted" style="margin-top:16px">持久任务 / 可随时恢复</div><div id="tasklist"></div><div class="card muted" style="margin-top:30px">Qwen3-4B 负责执行与回答；Qwen3-Embedding-0.6B 负责语义检索。历史原文保存在模型外部。</div></aside>
<section class="chat"><div class="titlebar"><h1 id="goal">创建一个任务，开始验证</h1><div class="toolbar"><button id="taskswitch">任务列表</button><button id="handoff">换窗交接</button><button id="recall">查询记忆</button><button id="rules">有效约束</button><button id="files">工作目录</button><button id="inspect">运行状态</button><button id="cancel">停止当前请求</button></div></div><div id="messages"><div class="empty">例如：计算 19 × 27，将结果写入 result.txt。<br>完成后换窗，再查询先前的结果与证据。</div></div><div class="composer"><div class="status" id="status"></div><div><textarea id="message" placeholder="交给一级 Agent 的任务或修正；Ctrl + Enter 发送"></textarea><button class="primary" id="send">发送</button></div><div class="muted" style="margin-top:7px">执行权限仅限本任务工作目录、计算器和模拟环境；记忆角色无法调用执行工具。</div></div></section>
<aside class="right"><section class="section"><h3>当前窗口</h3><div class="big" id="version">—</div><div class="muted" id="window"></div><div class="muted" id="constraintVersion"></div></section><section class="section"><h3>交接状态</h3><div id="summary" class="card muted">尚无交接记录</div></section><section class="section"><h3>模拟环境 · 非真实机器人</h3><div class="scene"><div class="room" id="roomA">房间 A</div><div class="room" id="roomB">房间 B</div></div><div class="muted" id="world"></div></section><section class="section"><h3>操作账本</h3><div id="operations"></div></section><section class="section"><h3>角色与事件</h3><div id="logs"></div></section></aside></main>
<dialog id="dialog"><h2 id="dialogTitle"></h2><div id="dialogBody"></div><div class="actions"><button id="closeDialog">关闭</button></div></dialog>
<script>
let recentEvents=[];
let selected=localStorage.getItem('lea.task'), snapshot=null, eventHash='', busy=false, toolNames=[], refreshing=false;
const $=id=>document.getElementById(id);
function node(tag,text,className){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(className)n.className=className;return n}
async function api(path,body,method){const r=await fetch('/api'+path,{method:method||(body?'POST':'GET'),headers:body?{'Content-Type':'application/json'}:{},body:body?JSON.stringify(body):undefined});const v=await r.json();if(!r.ok)throw Error(v.error||JSON.stringify(v.detail||v));return v}
function error(e){$('status').textContent=e.message;$('status').className='status error'}
function dialog(title){$('dialogTitle').textContent=title;$('dialogBody').replaceChildren();$('dialog').showModal();return $('dialogBody')}
function details(parent,title,data){const d=node('details'),s=node('summary',title),p=node('pre',typeof data==='string'?data:JSON.stringify(data,null,2));d.append(s,p);parent.append(d)}
function reference(parent,ref){const b=node('button',ref,'ref');b.onclick=async()=>{try{const data=await api('/tasks/'+selected+'/evidence?ref='+encodeURIComponent(ref));const body=dialog('原始证据');body.append(node('div',data.role+' · '+data.created,'muted'),node('pre',data.text))}catch(e){error(e)}};parent.append(b)}
async function loadTasks(){const tasks=await api('/tasks');$('tasklist').replaceChildren();for(const task of tasks){const b=node('button',task.goal,task.id===selected?'selected':'');b.title=task.goal;b.onclick=()=>select(task.id);$('tasklist').append(b)}if(!selected&&tasks.length)await select(tasks[0].id)}
async function select(id){selected=id;localStorage.setItem('lea.task',id);eventHash='';await loadTasks();await refresh()}
async function refresh(){if(!selected||refreshing)return;refreshing=true;try{const id=selected;const [s,events]=await Promise.all([api('/tasks/'+id),api('/tasks/'+id+'/events?tail=true')]);if(id!==selected)return;recentEvents=events;snapshot=s;const task=s.task;$('goal').textContent=task.goal;$('version').textContent='第 '+s.windows.length+' 个窗口';$('window').textContent=task.window_id;$('constraintVersion').textContent='状态 v'+task.version+' · 约束 v'+task.constraint_version;$('summary').textContent=task.state.summary||'尚无交接记录';$('roomA').classList.toggle('active',s.world.room==='A');$('roomB').classList.toggle('active',s.world.room==='B');$('world').textContent='世界 v'+s.world.version+' · 门'+(s.world.door_open?'已打开':'关闭')+' · '+(s.world.holding_cup?'已拿起杯子':'杯子在 '+s.world.cup_room);$('operations').replaceChildren();for(const op of s.operations.slice(-6)){const div=node('div',op.tool+' · '+op.status,'log');if(op.status==='needs_verification'){const b=node('button','核实结果');b.onclick=async()=>{try{await api('/tasks/'+selected+'/operations/'+op.id+'/verify',{});await refresh()}catch(e){error(e)}};div.append(b)}$('operations').append(div)}
const running=s.jobs.filter(j=>['running','queued'].includes(j.status));busy=running.length>0;$('cancel').disabled=!busy;const last=events.filter(e=>e.kind==='model_started'||e.kind==='model_result').at(-1);$('status').className='status';$('status').textContent=busy?'处理中 · '+(last?.role||'排队')+' · '+running.length+' 个请求':(s.jobs[0]?.status==='error'?s.jobs[0].error:'进度已保存');const hash=events.length+':'+(events.at(-1)?.id||'')+':'+s.jobs[0]?.status;if(hash===eventHash)return;eventHash=hash;$('messages').replaceChildren();for(const event of events.filter(e=>e.kind==='message'||e.kind==='assistant_reply')){const bubble=node('div',undefined,'bubble '+(event.role==='user'?'user':''));bubble.append(node('label',event.role==='user'?'你':(event.role==='runtime'?'运行时 · 证据回退':'一级 Agent')),node('div',event.text));for(const source of event.body?.sources_provided||[])reference(bubble,source.event_ref);$('messages').append(bubble)}const memoryResults=new Map();for(const job of s.jobs.filter(j=>j.kind==='query'&&j.status==='completed').reverse())if(job.result?.request_id)memoryResults.set(job.result.request_id,job.result);for(const event of events.filter(e=>e.kind==='retrieval_result'||e.kind==='archive_read_result'))memoryResults.set(event.body.request_id,event.body);for(const result of [...memoryResults.values()].sort((a,b)=>(a.source_cutoff_seq??0)-(b.source_cutoff_seq??0))){const card=node('div',undefined,'card');card.append(node('b','记忆查询 · '+(result.match_threshold===undefined&&result.answer_status==='retrieved'?'旧版原文候选':({index_matches:'检索上下文已准备，可直接回答',retrieved:'已按需读取原文，未做语义核验',no_matches:'未找到足够相关候选',model_reviewed:'模型辅助核验，仍需复核'}[result.answer_status]||result.answer_status))),node('div',result.answer||result.error));card.append(node('div',result.acceptance_policy?'候选规则：向量≥'+result.acceptance_policy.semantic_min+' 或关键词≥'+result.acceptance_policy.keyword_min+' · '+(result.acceptance_policy.calibrated?'已作开发集校准':'尚未校准'):(result.match_threshold===undefined?'旧版记录，未使用当前摘要门槛':'门槛 '+result.match_threshold+' · '+(result.score_type==='keyword_coverage'?'关键词覆盖率':'余弦相似度')+'（不是答案正确率）'),'muted'));for(const c of result.memory_candidates||[]){const entry=node('div',undefined,'card');entry.append(node('b',c.summary),node('div','匹配分数 '+c.match_score.toFixed(3)+' · '+({background_4b:'后台凝练',atomic_extractive:'短事实条目',handoff_model:'换窗摘要',original_window:'原文片段',original_sentence:'逐句基线',explicit_keyword_rescue:'原文补查'}[c.summary_method]||'摘要目录'),'muted'));const read=node('button','需要更多细节时读取存档');read.onclick=async()=>{try{await api('/tasks/'+selected+'/memory/read',{request_id:result.request_id,card_ids:[c.card_id],question:result.question||''});await refresh()}catch(e){error(e)}};entry.append(read);card.append(entry)}for(const e of result.evidence||[]){const quote=node('div','「'+e.quote+'」','muted');card.append(quote,node('div',({user_statement:'用户陈述',tool_observation:'工具观测',model_conclusion:'模型结论'}[e.source_type]||e.source_type),'muted'));reference(card,e.event_ref)}details(card,'检查范围与限制',result);$('messages').append(card)}if(!events.length)$('messages').append(node('div','发送第一条指令开始执行。','empty'));$('messages').scrollTop=$('messages').scrollHeight;$('logs').replaceChildren();for(const event of events.slice(-12).reverse()){const div=node('div',undefined,'log');div.append(node('b',event.role+' '),node('span',event.kind));details(div,'详情',event.body);$('logs').append(div)}}finally{refreshing=false}}
$('newtask').onclick=()=>{const body=dialog('新建持久任务');body.append(node('label','目标'));const goal=node('textarea');goal.placeholder='例如：计算并保存结果，跨窗口记住任务进度';body.append(goal,node('label','有效约束（每行一条）'));const rules=node('textarea');rules.placeholder='例如：回答使用中文；不得虚构工具执行结果';body.append(rules,node('label','完成标准（每行一条）'));const criteria=node('textarea');body.append(criteria);const label=node('label'),readonly=node('input');readonly.type='checkbox';label.append(readonly,document.createTextNode(' 只读任务：禁止写文件及改变模拟环境'));body.append(label);const create=node('button','创建任务','primary');create.onclick=async()=>{try{const t=await api('/tasks',{goal:goal.value,constraints:rules.value.split('\n').filter(Boolean),completion_criteria:criteria.value.split('\n').filter(Boolean),allowed_tools:readonly.checked?['workspace.list','workspace.read','calculator','world.observe']:toolNames});$('dialog').close();await select(t.id)}catch(e){error(e)}};body.append(create)};

$('taskswitch').onclick=async()=>{try{const body=dialog('持久任务');for(const task of await api('/tasks')){const b=node('button',task.goal+' · '+task.id.slice(-6)+' · v'+task.version);b.style.display='block';b.style.margin='8px 0';b.onclick=async()=>{$('dialog').close();await select(task.id)};body.append(b)}}catch(e){error(e)}};
$('newtaskTop').onclick=()=>$('newtask').click();
$('send').onclick=async()=>{if(!selected)return $('newtask').click();const text=$('message').value.trim();if(!text)return;try{await api('/tasks/'+selected+'/messages',{text,request_id:crypto.randomUUID()});$('message').value='';await refresh()}catch(e){error(e)}};$('message').onkeydown=e=>{if(e.ctrlKey&&e.key==='Enter')$('send').click()};
$('handoff').onclick=async()=>{if(!selected)return;try{await api('/tasks/'+selected+'/handoff',{});await refresh()}catch(e){error(e)}};
$('recall').onclick=()=>{if(!selected)return;const body=dialog('混合检索记忆');body.append(node('label','需要查找的问题'));const question=node('textarea');body.append(question,node('label','候选门槛覆盖（可选；不代表答案正确率）'));const threshold=node('input');threshold.type='number';threshold.min='0';threshold.max='1';threshold.step='0.01';threshold.value='';threshold.placeholder='留空使用当前规则，规则仍待独立校准';body.append(threshold);const label=node('label'),all=node('input');all.type='checkbox';label.append(all,document.createTextNode(' 扩大候选数量'));body.append(label);const rescueLabel=node('label'),rescue=node('input');rescue.type='checkbox';rescueLabel.append(rescue,document.createTextNode(' 补查原文关键词（用于索引遗漏，分数改为词项覆盖率）'));body.append(rescueLabel);const verifyLabel=node('label'),verify=node('input');verify.type='checkbox';verifyLabel.append(verify,document.createTextNode(' 读档后追加4B语义核验（较慢）'));body.append(verifyLabel);body.append(node('p','原文向量与关键词并行召回，轻量重排并补齐必要上下文。4B 可直接回答；缺少细节时再读存档。摘要仅作导航。','muted'));const b=node('button','检索记忆','primary');b.onclick=async()=>{try{await api('/tasks/'+selected+'/queries',{question:question.value,exhaustive:all.checked,verify:verify.checked,min_score:threshold.value===''?null:Number(threshold.value),search_archive:rescue.checked});$('dialog').close();await refresh()}catch(e){error(e)}};body.append(b)};
$('rules').onclick=()=>{if(!snapshot)return;const body=dialog('当前有效约束 · v'+snapshot.task.constraint_version),input=node('textarea');input.rows=8;input.value=snapshot.task.constraints.join('\n');const version=snapshot.task.constraint_version;body.append(input,node('p','保存后立即生效；旧版本生成的执行决定会被拒绝。','muted'));const b=node('button','保存新版本','primary');b.onclick=async()=>{try{await api('/tasks/'+selected+'/constraints',{constraints:input.value.split('\n').filter(Boolean),expected_version:version},'PUT');$('dialog').close();await refresh()}catch(e){error(e)}};body.append(b)};
$('files').onclick=async()=>{if(!selected)return;try{const body=dialog('任务工作目录');async function show(path){const data=await api('/tasks/'+selected+'/files?path='+encodeURIComponent(path));body.replaceChildren(node('div',path,'muted'));if(data.text!==undefined)body.append(node('pre',data.text));for(const entry of data.entries||[]){const b=node('button',(entry.directory?'📁 ':'')+entry.name);b.style.display='block';b.style.marginTop='8px';b.onclick=()=>show(path==='.'?entry.name:path+'/'+entry.name).catch(error);body.append(b)}}await show('.')}catch(e){error(e)}};

$('inspect').onclick=()=>{if(!snapshot)return;const body=dialog('运行状态与证据账本'),task=snapshot.task;body.append(node('b','状态 v'+task.version+' · 约束 v'+task.constraint_version),node('div','当前窗口 '+task.window_id,'muted'));details(body,'交接状态',task.state);details(body,'模拟环境（非真实机器人）',snapshot.world);for(const op of snapshot.operations){const card=node('div',undefined,'card');card.append(node('b',op.tool+' · '+op.status));details(card,'参数与结果',op);if(op.result?.evidence_ref)reference(card,op.result.evidence_ref);body.append(card)}for(const w of snapshot.windows)details(body,'历史窗口 '+w.id+' · '+w.status,w.handoff?JSON.parse(w.handoff):'当前窗口');for(const e of recentEvents.slice(-20).reverse())details(body,e.role+' · '+e.kind,e.body)};
$('cancel').onclick=async()=>{try{for(const job of snapshot.jobs.filter(j=>['running','queued'].includes(j.status)))await api('/jobs/'+job.id+'/cancel',{});await refresh()}catch(e){error(e)}};$('closeDialog').onclick=()=>$('dialog').close();
async function health(){try{const h=await api('/health');window.catalogThreshold=h.embedding?.min_score;const stages={downloading:'原始权重下载中',converting:'格式转换中',quantizing:'量化中',q4_ready_for_switch:'等待切换',verifying:'权重校验中',loading:'模型加载中',prepared:'模型启动中'};$('health').textContent=h.model.ready?h.precision+' 模型在线':(stages[h.preparation?.state]||'模型准备中')+(h.preparation?.state==='downloading'?' '+h.preparation.percent+'%':'');$('memoryHealth').textContent=h.memory_backend==='hybrid'?(h.embedding?.ready?'混合原文检索 · '+h.embedding.embedded_cards+'/'+h.embedding.total_cards+' 已编码 · 额外读档按需':'向量服务未就绪 · 默认返回空，可显式补查关键词'):'传统三级模型检索';$('config').textContent='工作预算 '+h.working_tokens+' tokens · 回答≤'+h.answer_max_chars+'字 · 后端 '+h.backend_context; }catch(e){$('health').textContent='服务未连接'}}
(async()=>{try{toolNames=Object.keys(await api('/tools'));await loadTasks();await health();await refresh()}catch(e){error(e)}})();setInterval(()=>refresh().catch(error),1500);setInterval(health,12000);
</script></body></html>
