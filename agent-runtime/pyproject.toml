[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-evolving-agent"
version = "0.1.0"
description = "Local short-context agents with transactional handoffs and evidence-based memory"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "httpx>=0.28,<1",
    "numpy>=2,<3",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.package-data]
lea = ["static/*"]

[tool.setuptools.packages.find]
include = ["lea*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
